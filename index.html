<!-- ★ Firebase SDK (여기서 버전 고정) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  ★ 여기에 Firebase 설정을 붙여넣으세요
//  Firebase Console > 프로젝트 설정 > 웹 앱 추가 후 복사
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const firebaseConfig = {
  apiKey: "AIzaSyBJ619FoOjPRXjQJrScR4646CZcvWTR6Aw",
  authDomain: "brtmsg.firebaseapp.com",
  projectId: "brtmsg",
  storageBucket: "brtmsg.firebasestorage.app",
  messagingSenderId: "14776740484",
  appId: "1:14776740484:web:29199c354502186ce4f0d1",
  measurementId: "G-85WMNV8NLP"
};


const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
window._db = db;
window._fbReady = true;

// 실시간 리스너 등록
const q = query(collection(db, "messages"), orderBy("ts", "asc"));
onSnapshot(q, (snap) => {
  window._messages = [];
  snap.forEach(d => window._messages.push({ id: d.id, ...d.data() }));
  window.renderBoard && window.renderBoard();
});

// 메세지 저장
window.fbAddMsg = async (data) => {
  return await addDoc(collection(db, "messages"), {
    ...data,
    ts: serverTimestamp()
  });
};

// 메세지 삭제
window.fbDeleteMsg = async (id) => {
  await deleteDoc(doc(db, "messages", id));
};
</script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {

}

html, body {

body {

}

.overlay { position:fixed; inset:0; z-index:300; background:rgba(200,200,255,0.25); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%); display:flex; align-items:center; justify-content:center; padding:20px; cursor:pointer; animation:fadeIn 0.2s ease; }

<!-- VIEW MODAL -->
<div id="view-modal" style="display:none">
  <div class="overlay" id="view-overlay">
    <div class="char-card" onclick="event.stopPropagation()">
      <div class="char-img-section" id="char-img-sec">
        <div id="char-img-inner"></div>
        <div class="char-name-ov" id="char-name-ov"></div>
      </div>
      <div class="char-body">
        <div class="speech-bubble" id="char-speech"></div>
        <p class="char-close-hint">화면을 터치하면 닫힙니다</p>
      </div>
    </div>
  </div>
</div>

<!-- WRITE MODAL -->
<div id="write-modal" style="display:none">
  <div class="sheet-overlay" id="write-overlay">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h2>✉ 메세지 작성</h2>
        <button class="btn btn-light" style="padding:6px 12px;font-size:0.76rem" onclick="closeWrite()">취소</button>
      </div>
      <div class="sheet-body">
        <div>
          <div class="field-label">이미지 (선택)</div>
          <div class="img-upload-row" onclick="document.getElementById('img-file').click()">
            <div id="img-thumb-wrap"><div class="img-icon-c">🖼</div></div>
            <div class="img-upload-text">
              <p>이미지 선택하기</p>
              <p>JPG, PNG, GIF · 선택사항</p>
            </div>
          </div>
          <input type="file" id="img-file" accept="image/*" style="display:none">
        </div>
        <div>
          <div class="field-label">이름 *</div>
          <input class="field-input" type="text" id="input-name" placeholder="이름을 입력하세요" maxlength="20">
        </div>
        <div>
          <div class="field-label">메세지 *</div>
          <textarea class="field-input" id="input-msg" placeholder="메세지를 입력하세요..." maxlength="400"></textarea>
        </div>
        <div>
          <div class="field-label">말풍선 컬러</div>
          <div class="color-box">
            <div class="color-top">
              <div class="color-preview" id="color-preview"></div>
              <input type="text" class="hex-input" id="hex-input" value="#A8D8F0" placeholder="#RRGGBB" maxlength="7">
              <span class="hex-label">HEX 직접 입력</span>
            </div>
            <div class="sl-row"><span class="sl-ch r">R</span><input type="range" class="rgb-sl" id="sl-r" min="0" max="255" value="168"><span class="sl-num" id="vr">168</span></div>
            <div class="sl-row"><span class="sl-ch g">G</span><input type="range" class="rgb-sl" id="sl-g" min="0" max="255" value="216"><span class="sl-num" id="vg">216</span></div>
            <div class="sl-row"><span class="sl-ch b">B</span><input type="range" class="rgb-sl" id="sl-b" min="0" max="255" value="240"><span class="sl-num" id="vb">240</span></div>
          </div>
        </div>
      </div>
      <div class="sheet-footer">
        <button class="btn btn-light" onclick="closeWrite()">취소</button>
        <button class="btn btn-primary" onclick="submitMsg()">작성 완료</button>
      </div>
    </div>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div id="confirm-modal" style="display:none">
  <div class="sm-overlay" onclick="closeConfirm()">
    <div class="sm-box" onclick="event.stopPropagation()">
      <h3>등록하시겠습니까?</h3>
      <p>작성 완료 후<br><strong style="color:#6366f1">수정 및 삭제가 불가능</strong>합니다.</p>
      <div class="btns">
        <button class="btn btn-primary" onclick="confirmPost()">네, 등록합니다</button>
        <button class="btn btn-light" onclick="closeConfirm()">다시 확인할게요</button>
      </div>
    </div>
  </div>
</div>

<!-- PW MODAL -->
<div id="pw-modal" style="display:none">
  <div class="sm-overlay" onclick="closePw()">
    <div class="sm-box pw-box" onclick="event.stopPropagation()">
      <h3>🔐 관리자 인증</h3>
      <input type="password" id="pw-input" placeholder="비밀번호" onkeydown="if(event.key==='Enter')checkPw()">
      <p id="pw-error"></p>
      <div class="pw-actions">
        <button class="btn btn-light" onclick="closePw()">취소</button>
        <button class="btn btn-primary" onclick="checkPw()">확인</button>
      </div>
    </div>
  </div>
</div>

<!-- EASTER EGG MODAL -->
<div id="egg-modal" style="display:none">
  <div class="sm-overlay" onclick="closeEgg()">
    <div class="sm-box" onclick="event.stopPropagation()">
      <h3 id="egg-title"></h3>
      <p id="egg-msg" style="white-space:pre-wrap"></p>
      <div class="btns"><button class="btn btn-primary" onclick="closeEgg()">확인</button></div>
    </div>
  </div>
</div>

<!-- LOADING -->
<div class="loading-overlay" id="loading" style="display:none">
  <div class="spinner"></div>
  <p>메세지를 전송하는 중...</p>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════
//  CONFIG
// ══════════════════════════════
const ADMIN_PW = 'board2025'; // ← 비밀번호 변경 가능
const EGG1 = ['브라운','착한친구','핑크','사회자','착한 친구','📺'];
const EGG2 = ['김솔음','솔음','포도','포도요원','노루','노루주임','🦌','🍇','노루 주임', '포도 요원'];
const EGG1_MSG = '하하하, 친구! 바쁜 나를 대신해서 메세지를 작성해주는 건가요?\n하지만 나를 배려하지 않아도 된답니다!';
const EGG2_MSG = '죄송합니다만, 제 사칭은 삼가주세요.';

// ══════════════════════════════
//  STATE
// ══════════════════════════════
window._messages = window._messages || [];
let positions    = {};
let deleteMode   = false;
let pendingMsg   = null;
let uploadedImg  = null;
let rgb          = {r:168, g:216, b:240};
let baseZ        = 10;
let isFirebaseReady = false;

try { positions = JSON.parse(localStorage.getItem('msgboard_pos_v4') || '{}'); } catch(e){}

// Firebase 준비 감지 (모듈 로드 후)
function checkFirebase() {
  if (window._fbReady) {
    isFirebaseReady = true;
    document.getElementById('setup-banner').style.display = 'none';
    setLive('connected');
  } else {
    setLive('disconnected');
  }
}
setTimeout(checkFirebase, 1500);

function setLive(state) {
  const dot  = document.getElementById('live-dot');
  const lbl  = document.getElementById('live-label');
  dot.className = 'live-dot ' + state;
  lbl.textContent = state === 'connected' ? '실시간' : state === 'connecting' ? '연결 중' : '오프라인';
}

// renderBoard는 Firebase onSnapshot에서 호출됨
window.renderBoard = renderBoard;

// ══════════════════════════════
//  HELPERS
// ══════════════════════════════
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm = s => s.replace(/\s/g,'').toLowerCase();
const hexToRgb = hex => { const m=hex.replace('#','').match(/([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})/i); return m?{r:parseInt(m[1],16),g:parseInt(m[2],16),b:parseInt(m[3],16)}:null; };
const rgbToHex = (r,g,b) => '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase();
const hexToRgba = (hex,a) => { const c=hexToRgb(hex); return c?`rgba(${c.r},${c.g},${c.b},${a})`:`rgba(168,216,240,${a})`; };
const getEmoji  = name => { const e=['🌟','🌙','🌊','🍀','🌸','⭐','🦋','🔮','✨','🧸','🌈','🐾']; let h=0; for(let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))&0xffff; return e[h%e.length]; };

function formatTime(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60)   return '방금 전';
  if (diff < 3600) return Math.floor(diff/60) + '분 전';
  if (diff < 86400)return Math.floor(diff/3600) + '시간 전';
  return `${d.getMonth()+1}/${d.getDate()}`;
}

// ══════════════════════════════
//  LAYOUT (중앙부터 채워지는 초기 위치)
// ══════════════════════════════
function getInitialPositions(msgs) {
  const BUBBLE_W = 270, BUBBLE_H = 115;
  const area = document.getElementById('float-area');
  const W = area.offsetWidth || window.innerWidth;
  const H = Math.max(area.offsetHeight, window.innerHeight - 60);
  const cols = Math.max(1, Math.floor((W - 32) / (BUBBLE_W + 20)));
  const rows = Math.ceil(msgs.length / cols);
  const totalW = cols * BUBBLE_W + (cols-1)*20;
  const totalH = rows * BUBBLE_H + (rows-1)*32;
  const startX = Math.max(16, (W - totalW) / 2);
  const startY = Math.max(20, (H - totalH) / 2);
  const tilts  = [-2.2,-1.1,0,0.9,2.0,-1.6,1.5,-0.5];
  const result = {};
  msgs.forEach((m,i) => {
    if (positions[m.id]) { result[m.id] = positions[m.id]; return; }
    const col=i%cols, row=Math.floor(i/cols);
    const rx=(Math.random()-.5)*16, ry=(Math.random()-.5)*12;
    result[m.id] = { x: startX+col*(BUBBLE_W+20)+rx, y: startY+row*(BUBBLE_H+32)+ry, tilt: tilts[i%tilts.length] };
  });
  return result;
}

// ══════════════════════════════
//  RENDER
// ══════════════════════════════
function renderBoard() {
  const msgs = window._messages || [];
  const area = document.getElementById('float-area');
  area.querySelectorAll('.float-bubble').forEach(el=>el.remove());
  document.getElementById('empty-state').style.display = msgs.length ? 'none' : 'block';
  document.getElementById('msg-count').textContent = msgs.length + '개의 메세지';
  if (!msgs.length) return;

  const pos = getInitialPositions(msgs);
  positions = pos;
  savePositions();

  msgs.forEach((m, i) => {
    const p = pos[m.id];
    const zIdx = baseZ + i;

    const avatarHtml = m.img
      ? `<img class="bbl-avatar" src="${m.img}" alt="" crossorigin="anonymous">`
      : `<div class="bbl-avatar-ph" style="background:${hexToRgba(m.color||'#A8D8F0',0.25)}">${getEmoji(m.name||'')}</div>`;

    const bubble = document.createElement('div');
    bubble.className = 'float-bubble';
    bubble.dataset.id = m.id;
    bubble.style.cssText = `left:${p.x}px;top:${p.y}px;z-index:${zIdx};transform:rotate(${p.tilt||0}deg);animation-delay:${i*0.04}s`;

    bubble.innerHTML = `
      <div class="bubble-layout">
        ${avatarHtml}
        <div class="bbl-wrap">
          <div class="bbl-name">${esc(m.name)}</div>
          <div class="bbl-body" style="background-image:linear-gradient(135deg,${hexToRgba(m.color||'#A8D8F0',0.22)} 0%,rgba(255,255,255,0) 100%)">
            <button class="bbl-del" onclick="delBubble(event,'${m.id}')">✕</button>
            ${esc(m.msg)}
          </div>
          <div class="bbl-time">${formatTime(m.ts)}</div>
        </div>
      </div>`;

    attachDrag(bubble, m.id);
    bubble.addEventListener('click', e => { if (bubble.dataset.dragged==='1') return; openView(m); });
    area.appendChild(bubble);
  });

  let maxY=0;
  Object.values(pos).forEach(p=>{ if(p.y+140>maxY) maxY=p.y+140; });
  area.style.minHeight = Math.max(maxY, window.innerHeight-60)+'px';
  if (deleteMode) area.classList.add('delete-mode');
  else area.classList.remove('delete-mode');
}

// ══════════════════════════════
//  DRAG
// ══════════════════════════════
function attachDrag(el, id) {
  let startX, startY, startLeft, startTop, isDragging=false, moved=false;
  const onStart = e => {
    if (e.target.classList.contains('bbl-del')) return;
    e.preventDefault();
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    const cy=e.touches?e.touches[0].clientY:e.clientY;
    startX=cx; startY=cy;
    startLeft=parseFloat(el.style.left)||0;
    startTop=parseFloat(el.style.top)||0;
    isDragging=true; moved=false; el.dataset.dragged='0';
    baseZ++;
    el.style.zIndex=baseZ+window._messages.length+10;
    el.classList.add('dragging');
  };
  const onMove = e => {
    if (!isDragging) return;
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    const cy=e.touches?e.touches[0].clientY:e.clientY;
    const dx=cx-startX, dy=cy-startY;
    if (Math.abs(dx)>3||Math.abs(dy)>3) { moved=true; el.dataset.dragged='1'; }
    if (!moved) return;
    e.preventDefault();
    el.style.left=(startLeft+dx)+'px';
    el.style.top=(startTop+dy)+'px';
  };
  const onEnd = () => {
    if (!isDragging) return;
    isDragging=false; el.classList.remove('dragging');
    positions[id] = { x:parseFloat(el.style.left), y:parseFloat(el.style.top), tilt:positions[id]?.tilt||0 };
    savePositions();
    setTimeout(()=>{ el.dataset.dragged='0'; }, 80);
  };
  el.addEventListener('mousedown', onStart);
  el.addEventListener('touchstart', onStart, {passive:false});
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('mouseup', onEnd);
  window.addEventListener('touchend', onEnd);
}

// ══════════════════════════════
//  VIEW MODAL
// ══════════════════════════════
function openView(m) {
  const sec=document.getElementById('char-img-sec');
  const inner=document.getElementById('char-img-inner');
  const nameEl=document.getElementById('char-name-ov');
  const speech=document.getElementById('char-speech');
  const c=hexToRgb(m.color||'#A8D8F0')||{r:168,g:216,b:240};
  sec.style.background=`linear-gradient(145deg,${m.color||'#A8D8F0'},rgb(${Math.max(0,c.r-40)},${Math.max(0,c.g-40)},${Math.max(0,c.b-50)}))`;
  inner.innerHTML = m.img
    ?`<img class="char-img-full" src="${m.img}" alt="" crossorigin="anonymous">`
    :`<div class="char-img-ph-full" style="background:linear-gradient(145deg,${m.color||'#A8D8F0'},rgb(${Math.max(0,c.r-40)},${Math.max(0,c.g-40)},${Math.max(0,c.b-50)}))">${getEmoji(m.name||'')}</div>`;
  nameEl.textContent=m.name;
  speech.textContent=m.msg;
  document.getElementById('view-modal').style.display='block';
}
document.getElementById('view-overlay').addEventListener('click',()=>{ document.getElementById('view-modal').style.display='none'; });

// ══════════════════════════════
//  WRITE MODAL
// ══════════════════════════════
document.getElementById('write-btn').addEventListener('click', openWrite);
function openWrite(){
  document.getElementById('input-name').value='';
  document.getElementById('input-msg').value='';
  uploadedImg=null;
  document.getElementById('img-thumb-wrap').innerHTML='<div class="img-icon-c">🖼</div>';
  document.getElementById('img-file').value='';
  setRgb(168,216,240);
  document.getElementById('write-modal').style.display='block';
}
document.getElementById('write-overlay').addEventListener('click',function(e){ if(e.target===this) closeWrite(); });
function closeWrite(){ document.getElementById('write-modal').style.display='none'; }

document.getElementById('img-file').addEventListener('change',function(){
  const f=this.files[0]; if(!f) return;
  if(f.size>1.5*1024*1024){ toast('이미지는 1.5MB 이하로 올려주세요'); return; }
  const r=new FileReader();
  r.onload=e=>{ uploadedImg=e.target.result; document.getElementById('img-thumb-wrap').innerHTML=`<img class="img-thumb-c" src="${uploadedImg}" alt="">`; };
  r.readAsDataURL(f);
});

// ── 컬러 ──
function setRgb(r,g,b){
  r=Math.max(0,Math.min(255,Math.round(r))); g=Math.max(0,Math.min(255,Math.round(g))); b=Math.max(0,Math.min(255,Math.round(b)));
  rgb={r,g,b};
  const hex=rgbToHex(r,g,b);
  document.getElementById('color-preview').style.background=hex;
  document.getElementById('hex-input').value=hex;
  document.getElementById('sl-r').value=r; document.getElementById('vr').textContent=r;
  document.getElementById('sl-g').value=g; document.getElementById('vg').textContent=g;
  document.getElementById('sl-b').value=b; document.getElementById('vb').textContent=b;
  document.getElementById('sl-r').style.background=`linear-gradient(to right,#f3f4f6,#ef4444)`;
  document.getElementById('sl-g').style.background=`linear-gradient(to right,#f3f4f6,#22c55e)`;
  document.getElementById('sl-b').style.background=`linear-gradient(to right,#f3f4f6,#3b82f6)`;
}
setRgb(168,216,240);
['r','g','b'].forEach(ch=>{
  document.getElementById('sl-'+ch).addEventListener('input',function(){
    rgb[ch]=parseInt(this.value);
    const hex=rgbToHex(rgb.r,rgb.g,rgb.b);
    document.getElementById('color-preview').style.background=hex;
    document.getElementById('hex-input').value=hex;
    document.getElementById('v'+ch).textContent=this.value;
  });
});
document.getElementById('hex-input').addEventListener('input',function(){
  let v=this.value.trim(); if(!v.startsWith('#')) v='#'+v;
  if(/^#[0-9a-f]{6}$/i.test(v)){const c=hexToRgb(v);if(c)setRgb(c.r,c.g,c.b);}
  document.getElementById('color-preview').style.background=v;
});

// ══════════════════════════════
//  EASTER EGG
// ══════════════════════════════
function checkEgg(name){
  const n=norm(name);
  for(const k of EGG1) if(n.includes(norm(k))){ showEgg('👀 잠깐!',EGG1_MSG); return true; }
  for(const k of EGG2) if(n.includes(norm(k))){ showEgg('🚫 사칭 주의',EGG2_MSG); return true; }
  return false;
}
function showEgg(t,m){ document.getElementById('egg-title').textContent=t; document.getElementById('egg-msg').textContent=m; document.getElementById('egg-modal').style.display='block'; }
function closeEgg(){ document.getElementById('egg-modal').style.display='none'; }

// ══════════════════════════════
//  SUBMIT
// ══════════════════════════════
function submitMsg(){
  const name=document.getElementById('input-name').value.trim();
  const msg=document.getElementById('input-msg').value.trim();
  if(!name){ toast('이름을 입력해주세요'); return; }
  if(!msg){ toast('메세지를 입력해주세요'); return; }
  if(checkEgg(name)) return;
  pendingMsg={ name, msg, img: uploadedImg, color: rgbToHex(rgb.r,rgb.g,rgb.b) };
  document.getElementById('confirm-modal').style.display='block';
}
function closeConfirm(){ document.getElementById('confirm-modal').style.display='none'; pendingMsg=null; }

async function confirmPost(){
  if(!pendingMsg) return;
  document.getElementById('confirm-modal').style.display='none';
  document.getElementById('write-modal').style.display='none';

  if(!window._fbReady){
    // Firebase 미연결: 로컬 임시 저장
    window._messages.push({ id: Date.now().toString(), ...pendingMsg, ts: new Date() });
    renderBoard();
    toast('⚠️ Firebase 미연결 — 로컬에만 저장됐어요');
    pendingMsg=null; return;
  }

  document.getElementById('loading').style.display='flex';
  try {
    await window.fbAddMsg(pendingMsg);
    toast('메세지가 등록됐어요 ✓');
  } catch(e) {
    toast('전송 실패. 다시 시도해주세요.');
    console.error(e);
  }
  document.getElementById('loading').style.display='none';
  pendingMsg=null;
}

// ══════════════════════════════
//  DELETE MODE
// ══════════════════════════════
document.getElementById('del-btn').addEventListener('click',function(){
  if(deleteMode){
    deleteMode=false; this.classList.remove('active'); this.innerHTML='🔒 관리';
    document.getElementById('float-area').classList.remove('delete-mode');
    toast('관리자 모드 종료');
  } else {
    document.getElementById('pw-input').value='';
    document.getElementById('pw-error').textContent='';
    document.getElementById('pw-modal').style.display='block';
    setTimeout(()=>document.getElementById('pw-input').focus(),80);
  }
});
function closePw(){ document.getElementById('pw-modal').style.display='none'; }
function checkPw(){
  if(document.getElementById('pw-input').value===ADMIN_PW){
    deleteMode=true;
    const btn=document.getElementById('del-btn');
    btn.classList.add('active'); btn.innerHTML='🔓 관리 중';
    document.getElementById('float-area').classList.add('delete-mode');
    closePw(); toast('관리자 모드 활성화 🔓');
  } else {
    document.getElementById('pw-error').textContent='비밀번호가 올바르지 않습니다.';
    document.getElementById('pw-input').value='';
  }
}

async function delBubble(e, id){
  e.stopPropagation();
  if(!confirm('이 메세지를 삭제할까요?')) return;
  if(window._fbReady){
    document.getElementById('loading').style.display='flex';
    try { await window.fbDeleteMsg(id); toast('삭제됐습니다.'); }
    catch(err){ toast('삭제 실패'); }
    document.getElementById('loading').style.display='none';
  } else {
    window._messages=window._messages.filter(m=>m.id!==id);
    delete positions[id]; savePositions(); renderBoard(); toast('삭제됐습니다.');
  }
}

// ══════════════════════════════
//  STORAGE
// ══════════════════════════════
function savePositions(){ try{ localStorage.setItem('msgboard_pos_v4', JSON.stringify(positions)); }catch(e){} }

let _tt;
